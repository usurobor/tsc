id          = "05-adversarial"
difficulty  = 4
mode        = "mechanical"
description = "Adversarial — multi-file input with high surface regularity but cross-file semantic contradictions; mechanical scorer correctly identifies it as incoherent"

prerequisites = ["01-glider", "02-random-soup"]

# Three sibling files that look canonical (same headings, version stamps, dense
# cross-references, "supersedes" markers) but contradict each other
# semantically — each declares itself "canonical" and the other two
# "informative", and each picks a different transport (UDP / TCP / QUIC) for
# the protocol's core invariant. The contradictions emerge ACROSS files; no
# single file is internally inconsistent.

[input]
files = [
  "input/spec-a.md",
  "input/spec-b.md",
  "input/spec-c.md",
]

[expected]
verdict = "fail"

[expected.score_range]
# Pre-cutover (v0.9.x) arithmetic-mean reading: c_sigma = 0.7466
# (α=0.969 β=0.470 γ=0.801; bottleneck β cross-reference +
# source-of-truth alignment caught the cross-file contradictions).
# Post-cutover (v0.10.0) canonical geometric reading:
#   c_sigma_num = (0.969·0.470·0.801)^(1/3) ≈ 0.7145
# max=0.78 is retained intentionally (rationale_category =
# "frontier-tightening"): the kata's documented "moving frontier"
# semantics. Tightening to 0.72 (ceil-2dp of 0.7145+0.001) would
# remove the small forward-looking margin kata-05 deliberately
# carries so that small α/γ refinements do not flip the verdict.
# See [baseline] below.
min = 0.0
max = 0.78
bottleneck_axis = "beta"

[baseline]
# v0.10.x baseline provenance (instrument-validity pass; supersedes the
# #54 AC1 baseline recorded below as history).
baseline_engine_commit  = "pending-ci"
baseline_engine_version = "0.10.0"
baseline_command        = "coh --kata 05-adversarial --mode mechanical"
mode                    = "mechanical"
config_hash             = "pending-ci"
input_file_hashes       = "pending-ci"
alpha                   = 0.9692 # explicit reading, instrument-validity pass HEAD
beta                    = 0.6367 # explicit reading, instrument-validity pass HEAD
gamma                   = 0.7556 # explicit reading, instrument-validity pass HEAD
c_sigma_math            = 0.7754 # = (0.9692·0.6367·0.7556)^(1/3)
c_sigma_num             = 0.7754 # equal to c_sigma_math when no zero component is present
zero_component_present  = false
numeric_floor_applied   = false
rationale_category      = "frontier-tightening"
# Rationale: the instrument-validity pass changed HOW this kata fails,
# not WHETHER it fails. The old β=0.470 catch was a path artifact —
# links counted as unresolved only because the kata runner prefixes
# bundle paths while the inputs link sibling-relative; link
# normalization removed that false positive. The corpus is now caught
# by its REAL contradictions: three documents each self-claiming to be
# the canonical definition (beta.authority_alignment, steep contest
# penalty) and anchors citing sections the targets do not have
# (spec-a cites spec-c §3 as "historical-tcp-mode", spec-b as
# "historical-udp-mode"; spec-c §3 is "Segment format").
# max=0.78 is retained per the moving-frontier doctrine; the margin is
# now thin (0.7754 observed) by construction — the next scorer
# refinement surfaces here first, which is this kata's job.
# Historical baseline (cycle/34 → #54 AC1): α=0.969 β=0.470 γ=0.801,
# c_sigma_num=0.7145.
