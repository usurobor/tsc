id          = "04-philosophical"
difficulty  = 3
mode        = "mechanical"
description = "Cross-domain — natural-language philosophical text; documents the upper limit of mechanical scoring (over-rates surface structure)"

prerequisites = ["01-glider", "02-random-soup"]

[input]
files = ["input/consciousness.md"]

[expected]
# verdict = "fail" records the *semantic* claim that natural-language
# philosophical text — though high in surface regularity — is not what TSC
# considers a coherent system. The mechanical scorer assigns a deceptively
# high C_Σ because its structural-proxy signals (heading consistency, version
# stamps, cross-references) are all present. The kata thus passes (because
# c_sigma <= max) while *documenting* that mechanical scoring overestimates
# this class of input. See README §"Mode justification".
verdict = "fail"

[expected.score_range]
# Pre-cutover (v0.9.x) arithmetic-mean reading: c_sigma = 0.9333.
# Post-cutover (v0.10.0) canonical geometric reading:
#   c_sigma_num = (α·β·γ)^(1/3) = (1.000·1.000·0.800)^(1/3) ≈ 0.9283
# max=0.95 is retained intentionally (rationale_category =
# "frontier-tightening"): the wide range is itself the load-bearing
# claim — mechanical scoring cannot discriminate this from kata-01 by
# structural proxies alone. Tighten in a future cycle once the
# mechanical scorer learns to discriminate philosophical prose from
# engineering docs. See [baseline] below.
min = 0.0
max = 0.95
bottleneck_axis = "gamma"

[baseline]
# v0.10.0 baseline provenance per #54 AC1.
baseline_engine_commit  = "pending-ci"
baseline_engine_version = "0.10.0"
baseline_command        = "coh --kata 04-philosophical --mode mechanical"
mode                    = "mechanical"
config_hash             = "pending-ci"
input_file_hashes       = "pending-ci"
alpha                   = 1.000  # explicit reading, cycle/34-impl HEAD
beta                    = 1.000  # explicit reading, cycle/34-impl HEAD
gamma                   = 0.800  # explicit reading, cycle/34-impl HEAD
c_sigma_math            = 0.9283 # = (1.0·1.0·0.8)^(1/3)
c_sigma_num             = 0.9283 # equal to c_sigma_math when no zero component is present
zero_component_present  = false
numeric_floor_applied   = false
rationale_category      = "frontier-tightening"
# Rationale: max=0.95 (vs computed-and-margin 0.93) is retained because
# the wideness itself is the kata's load-bearing documentation: the
# mechanical scorer's inability to discriminate philosophical prose
# from engineering docs IS the lesson kata-04 records. Per-axis
# scores (α=1.000, β=1.000, γ=0.800) are explicit cycle/34 calibration
# readings — only the aggregate is recomputed from arithmetic to
# geometric mean.
