id          = "01-glider"
difficulty  = 1
mode        = "mechanical"
description = "Positive control — well-structured document with consistent terminology and explicit cross-references"

prerequisites = []

[input]
files = ["input/glider.md"]

[expected]
verdict = "pass"

[expected.score_range]
# v0.10.0 cutover (cycle #54): expected.score_range remains conservative
# because kata-01's (α, β, γ) triple was never recorded explicitly in
# the cycle-34 calibration — only the arithmetic-mean c_sigma 0.923 is
# on record alongside per-signal narrative scores in README. Re-baseline
# against the canonical geometric c_sigma_num is deferred to the first
# CI run on v0.10.0 (see [baseline] below + #54 §Known debt). The 0.87
# floor brackets the *inferred* geometric value (≈0.917 on README
# triple-estimate α≈1.000, β≈0.990, γ≈0.779) with margin for the
# unrecorded uncertainty.
min = 0.87
max = 1.0

[baseline]
# v0.10.0 baseline provenance per #54 AC1.
# Records the canonical-aggregate (geometric c_sigma_num) re-baseline
# state. When the field value is "pending-ci", the v0.10.0 first CI run
# on this kata records the observed c_sigma_num + c_sigma_math here and
# the cycle that does so tightens expected.score_range accordingly.
baseline_engine_commit  = "pending-ci"
baseline_engine_version = "0.10.0"
baseline_command        = "coh --kata 01-glider --mode mechanical"
mode                    = "mechanical"
config_hash             = "pending-ci"
input_file_hashes       = "pending-ci"
alpha                   = 1.0000  # instrument-validity pass HEAD
beta                    = 1.0000  # instrument-validity pass HEAD
gamma                   = 0.7850  # instrument-validity pass HEAD
c_sigma_math            = 0.9225  # = (α·β·γ)^(1/3)
c_sigma_num             = 0.9225  # equal to c_sigma_math when no zero component is present
zero_component_present  = false
numeric_floor_applied   = false
rationale_category      = "aggregate-correction"
# Rationale: pre-cutover engine emitted arithmetic mean (α+β+γ)/3 = 0.923;
# canonical v3.2 emits geometric (α·β·γ)^(1/3) ≈ 0.917. The score_range
# is unchanged because (a) the geometric estimate still falls inside
# [0.87, 1.0] and (b) the (α, β, γ) triple is an estimate from the
# cycle-34 README signal narrative, not a recorded calibration triple —
# tightening on estimated values would be premature.
