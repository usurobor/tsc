id          = "03-comparative"
difficulty  = 2
mode        = "mechanical"
description = "Comparative — ranks well-structured (glider) above incoherent (random-soup) by mechanical C_Σ"

prerequisites = ["01-glider", "02-random-soup"]

# Phase-2 kata.toml extension: [[components]] is an ordered list of named
# sub-bundles. Each component is scored independently. When components is
# non-empty, the runner's pass-criterion is [expected.ranking] (an ordered
# list of component ids, highest C_Σ first) rather than a single-bundle
# score range. Phase 1 single-component katas continue to use [input].files
# unchanged.

[[components]]
id    = "glider"
files = ["input/glider/glider.md"]

[[components]]
id    = "random-soup"
files = ["input/random-soup/random-soup.md"]

[expected]
verdict = "pass"
# Component ids ordered by expected C_Σ, highest first. The runner verifies
# the actual ranking matches and emits ranking_correct in the result JSON.
ranking = ["glider", "random-soup"]

[baseline]
# v0.10.0 baseline provenance per #54 AC1.
# Comparative katas have no single score_range — pass criterion is the
# ranking, which is sign-preserving under the v0.9.x arithmetic-mean →
# v0.10.0 geometric-mean change (both means are monotone in each axis
# when no zero component is present). The recorded c_sigma_math /
# c_sigma_num values are per-component estimates; expected.ranking
# is unchanged.
baseline_engine_commit  = "pending-ci"
baseline_engine_version = "0.10.0"
baseline_command        = "coh --kata 03-comparative --mode mechanical"
mode                    = "mechanical"
config_hash             = "pending-ci"
input_file_hashes       = "pending-ci"
zero_component_present  = false
numeric_floor_applied   = false
rationale_category      = "aggregate-correction"

[[baseline.components]]
id           = "glider"
# Inherits kata-01 baseline (input is a copy of katas/01-glider/input/glider.md).
alpha        = 1.000
beta         = 1.0000
gamma        = 0.7850
c_sigma_math = 0.9225
c_sigma_num  = 0.9225

[[baseline.components]]
id           = "random-soup"
# Inherits kata-02 baseline (input is a copy of katas/02-random-soup/input/random-soup.md).
alpha        = 0.9429
beta         = 0.4500
gamma        = 0.6961
c_sigma_math = 0.6659
c_sigma_num  = 0.6659
