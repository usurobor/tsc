# INVALID — expected reason: failure / no-decision consequence missing.
# `post_result_rule.on_failure` is omitted AND `no_decision.consequence`
# is omitted. A prereg that does not say what a FAILURE or a NO-DECISION
# binds is not a contract — the whole point of pre-registration is that the
# verdict's consequence is fixed before the run. `cue vet` fails:
# post_result_rule.on_failure and no_decision.consequence not present.

id: failure-consequence-missing-probe
title: "A probe that never says what a failure means"
axis: beta
status: proposed

human_intent:
  claim: "some claim"
  why_it_matters: "some reason"

hypothesis:
  variance_source: "unbounded selection"
  intervention: "engine enumerates; LLM adjudicates"

factorization:
  inventory_owner: engine
  judgment_owner: llm
  aggregation_owner: engine
  loci:
    - kind: citation_bears_claim
      enumerator: "one locus per internal link"
      source_span: "the linking line"
      target_span: "the target section"

judgment_contract:
  allowed_labels: [bears, does_not_bear]
  evidence_required: "source + target on does_not_bear"
  refusal: "missing/duplicate refuses the sample"

aggregation:
  formula: "beta = 1 - sum(w*d)/sum(w)"
  label_weights: {bears: 0.0, does_not_bear: 1.0}
  kind_weights: {citation_bears_claim: 1.0}

consistency_gate:
  samples: 3
  agreement_floor: 0.90
  standing_effect: "a miss publishes without standing"

discrimination_gate:
  controls: "controls.json"

no_decision:
  condition: "more than one sparse target"
  # consequence: OMITTED   <-- the defect: no NO-DECISION consequence

success:
  all_of: ["floor met"]

failure:
  any_of: ["floor missed"]

post_result_rule:
  # on_failure: OMITTED     <-- the defect: no failure consequence
  on_success: "promote"
  forbidden: ["re-tune and re-run"]
