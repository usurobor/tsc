# INVALID — expected reason: factorization owners undeclared.
# The seam requires all three owners (inventory / judgment / aggregation)
# to be named; here `judgment_owner` and `aggregation_owner` are omitted.
# Without them the anti-freedom split is not specified -> not executable.
# `cue vet` fails: judgment_owner / aggregation_owner not present.

id: owners-undeclared-probe
title: "A probe that does not say who owns each stage"
axis: beta
status: proposed

human_intent:
  claim: "some claim"
  why_it_matters: "some reason"

hypothesis:
  variance_source: "unbounded selection"
  intervention: "engine enumerates; LLM adjudicates"

factorization:
  inventory_owner: engine
  # judgment_owner: OMITTED    <-- the defect
  # aggregation_owner: OMITTED <-- the defect
  loci:
    - kind: citation_bears_claim
      enumerator: "one locus per internal link"
      source_span: "the linking line"
      target_span: "the target section"

judgment_contract:
  allowed_labels: [bears, does_not_bear]
  evidence_required: "source + target on does_not_bear"
  refusal: "missing/duplicate refuses the sample"

aggregation:
  formula: "beta = 1 - sum(w*d)/sum(w)"
  label_weights: {bears: 0.0, does_not_bear: 1.0}
  kind_weights: {citation_bears_claim: 1.0}

consistency_gate:
  samples: 3
  agreement_floor: 0.90
  standing_effect: "a miss publishes without standing"

discrimination_gate:
  controls: "controls.json"

no_decision:
  condition: "more than one sparse target"
  consequence: "record NO-DECISION"

success:
  all_of: ["floor met"]

failure:
  any_of: ["floor missed"]

post_result_rule:
  on_failure: record_failed_experiment
  on_success: "promote"
  forbidden: ["re-tune and re-run"]
