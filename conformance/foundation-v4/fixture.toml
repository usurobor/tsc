oracle = "policy test"

[[cases]]
id = "oper-receipt-positive"
requirement = "OPER-RECEIPT-001"
polarity = "positive"
given = ["each terminal execution class"]
expect = ["receipt emitted"]
oracle = "terminal-path integration"

[[cases]]
id = "oper-receipt-negative"
requirement = "OPER-RECEIPT-001"
polarity = "negative"
