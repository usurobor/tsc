format = "tsc-conformance-fixture/0.1"
id = "polar-syntax-v4-1"
version = "0.1.0"
status = "specified"
domain = "C≡ 4.1 polar source grammar and typed elaboration contract"
requirements = [
  "FND-POLAR-001",
  "FND-POLAR-002",
  "FND-POLAR-003",
  "FND-POLAR-004",
  "FND-POLAR-005",
  "FND-FRAME-001",
  "FND-CONSERVATIVE-001",
]

[claim_contract]
generator_class = "bounded generated PolarTerm and PolarFrame syntax trees"
equivalence = "exact ordered AST equality; explicit reversal tracked separately"
generator_search_claim = "complete_within_bound"
generator_search_bound = "all labels and trees through the fixture-declared node bound"
relation_search_claim = "complete_within_bound"
relation_search_bound = "all projective/inclusive node typings, structural admissibility predicates, and frame bridge declarations through the fixture bound"
evidence_boundary = "parser, serializer, AST, elaboration-shape, and conservative-embedding cases"
oracle_independence = "expected ASTs and rejection reasons are generated independently from parser output"

[generator]
kind = "polar grammar and AST case generator"
planned_source = "polar-syntax-v4.1/generator"
deterministic = true

[oracle]
kind = "reference parser, tree-shape, and elaboration-contract oracle"
planned_source = "polar-syntax-v4.1/oracle"

[reproducibility]
planned_command = "coh conformance run polar-syntax-v4-1"

[[cases]]
id = "polar-syntax-positive"
requirement = "FND-POLAR-001"
polarity = "positive"
given = ["(1 ≡ 0)", "the exact three-line foundational expression"]
expect = ["binary form parses as Dim(1,0)", "three-line form parses as Whole, Frame(Whole,Whole,Whole), and a three-role frame"]
oracle = "reference AST equality"

[[cases]]
id = "polar-syntax-negative"
requirement = "FND-POLAR-001"
polarity = "negative"
given = ["ambiguous chain", "attempted equality or directed-event interpretation"]
expect = ["parse or semantic validation refusal"]
oracle = "reference parser and semantic-kind checker"

[[cases]]
id = "polar-shape-positive"
requirement = "FND-POLAR-002"
polarity = "positive"
given = ["((1 ≡ 0) ≡ (lim ≡ ∞))"]
expect = ["four label nodes", "three distinct dimension nodes", "ordered parent-child paths retained"]
oracle = "AST node and path inventory"

[[cases]]
id = "polar-shape-negative"
requirement = "FND-POLAR-002"
polarity = "negative"
given = ["flattened label multiset", "reassociated or commutatively folded tree"]
expect = ["conformance failure"]
oracle = "AST shape comparator"

[[cases]]
id = "polar-orientation-positive"
requirement = "FND-POLAR-003"
polarity = "positive"
given = ["one projective node", "one inclusive node", "explicit reversal"]
expect = ["constructors remain distinct", "root reversal is involutive", "nested child orientation is unchanged"]
oracle = "type and structural property checker"

[[cases]]
id = "polar-orientation-negative"
requirement = "FND-POLAR-003"
polarity = "negative"
given = ["untyped orientation flag", "silent Dim(x,y)=Dim(y,x)"]
expect = ["conformance failure"]
oracle = "constructor and equivalence checker"

[[cases]]
id = "polar-ground-positive"
requirement = "FND-POLAR-004"
polarity = "positive"
given = ["two structurally different terms with the same ground value"]
expect = ["ground values equal", "ASTs remain distinct"]
oracle = "grounding and AST comparator"

[[cases]]
id = "polar-ground-negative"
requirement = "FND-POLAR-004"
polarity = "negative"
given = ["ground equality used for substitution or realization"]
expect = ["semantic validation refusal"]
oracle = "grounding-use checker"

[[cases]]
id = "polar-frame-positive"
requirement = "FND-FRAME-001"
polarity = "positive"
given = ["Frame(Dim(I,AM),Dim(lim,∞),Dim(1,0))", "explicit frame witness and bridges"]
expect = ["all three trees retained", "typed witness accepted"]
oracle = "frame AST and bridge checker"

[[cases]]
id = "polar-frame-negative"
requirement = "FND-FRAME-001"
polarity = "negative"
given = ["middle term silently treated as Rel(root(left),root(right))", "binary association of frame"]
expect = ["conformance failure"]
oracle = "frame elaboration checker"

[[cases]]
id = "polar-conservative-positive"
requirement = "FND-CONSERVATIVE-001"
polarity = "positive"
given = ["valid v4.0 presentation", "polar_source = none"]
expect = ["identical canonical presentation and receipt semantics"]
oracle = "v4.0/v4.1 no-polar byte and semantic comparison"

[[cases]]
id = "polar-conservative-negative"
requirement = "FND-CONSERVATIVE-001"
polarity = "negative"
given = ["no-polar v4.0 presentation", "v4.1 implementation changes classification or requires polar fields"]
expect = ["conformance failure"]
oracle = "conservative embedding comparator"

[[cases]]
id = "polar-admissibility-positive"
requirement = "FND-POLAR-005"
polarity = "positive"
given = ["raw elaborations", "declared label/Whole interpretation, constructor policy, structural candidate class, nondegeneracy, boundary faithfulness, and equivalence"]
expect = ["only structurally contract-satisfying elaborations admitted", "negative case retained"]
oracle = "exact structural admissibility checker"

[[cases]]
id = "polar-admissibility-negative"
requirement = "FND-POLAR-005"
polarity = "negative"
given = ["initial, terminal, empty, singleton, monic, or epic raw elaboration admitted by existence alone"]
expect = ["conformance failure"]
oracle = "vacuity and structural contract checker"
