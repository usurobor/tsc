# one-off-validate-claude-token.yml — verify the CI witness credential works.
# Injects the CLAUDE_CODE_OAUTH_TOKEN secret exactly as tsc-self-measure.yml does,
# installs the pinned Claude CLI, and checks for a live authenticated response via
# a nonce. The token is never printed. Remove after use by deleting the branch.
name: one-off-validate-claude-token

on:
  push:
    branches: ['chore/validate-claude-token']

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe CLAUDE_CODE_OAUTH_TOKEN via a live 1-turn call
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "RESULT: SECRET_ABSENT — CLAUDE_CODE_OAUTH_TOKEN is not configured on this repo"
            exit 1
          fi
          echo "secret present (value hidden)"
          npm install -g @anthropic-ai/claude-code@2.1.199 >/dev/null 2>&1 || { echo "RESULT: CLI_INSTALL_FAILED"; exit 1; }
          # Route by shape, same as the self-measure witness: an sk-ant-api key
          # belongs in ANTHROPIC_API_KEY. Never printed.
          if [ "${CLAUDE_CODE_OAUTH_TOKEN#sk-ant-api}" != "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            export ANTHROPIC_API_KEY="$CLAUDE_CODE_OAUTH_TOKEN"
            unset CLAUDE_CODE_OAUTH_TOKEN
            echo "auth mode: ANTHROPIC_API_KEY (sk-ant-api shape)"
          else
            echo "auth mode: CLAUDE_CODE_OAUTH_TOKEN (oauth shape)"
          fi
          NONCE="tsc-witness-live-$(date +%s)"
          OUT="$(claude -p "Reply with exactly this string and nothing else: ${NONCE}" \
                   --permission-mode acceptEdits --max-turns 1 2>&1 || true)"
          echo "--- response head (first 160 chars, token-free) ---"
          printf '%s' "$OUT" | head -c 160; echo
          if printf '%s' "$OUT" | grep -qF "$NONCE"; then
            echo "RESULT: TOKEN_OK — Claude CLI authenticated and returned the live nonce"
          else
            echo "RESULT: TOKEN_FAILED — no valid nonce response (auth failure, quota, or empty output)"
            exit 1
          fi
