name: ci

on:
  push:
    branches: [ main, master, 'cycle/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system depexts (libcurl for ezcurl)
        # Pre-install libcurl4-openssl-dev so opam-depext / setup-ocaml
        # does not need to resolve the (occasionally 404ing) gnutls flavour.
        # See cycle #26 β observation and cycle #32 AC5.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: engine/ocaml
        run: opam install . --deps-only --with-test -y

      - name: Build
        working-directory: engine/ocaml
        run: opam exec -- dune build

      - name: Test
        working-directory: engine/ocaml
        run: opam exec -- dune runtest

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: coh-linux-x64
          path: engine/ocaml/_build/default/bin/main.exe
          retention-days: 90

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (Markdown)
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200..299,403,429
            --exclude-path "CHANGELOG.md|LICENSE|heldout/revealed"
            -- *.md **/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required spec files present
        run: |
          missing=0
          for f in \
            spec/c-equiv.md \
            spec/tsc-core.md \
            spec/tsc-oper.md \
            spec/tsc-observation-dynamics.md \
            spec/tsc-conformance.md \
            spec/tsc-glossary.md \
            spec/README.md; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=$((missing + 1))
            else
              echo "OK: $f"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "spec-validate: $missing required spec file(s) missing"
            exit 1
          fi
          echo "spec-validate: all required spec files present"

      - name: Check spec status headers (4.1 draft cycle)
        run: |
          # During the 4.1 draft cycle the five normative bodies + the spec
          # index read `**Status:** Draft`; the glossary reads
          # `**Status:** Informative`. The ratification-only commit flips the
          # bodies Draft -> Normative and this expected value with them.
          # Guards against a partial or mixed status surface.
          fail=0
          check_status() {
            local f="$1" want="$2" line
            line=$(grep -m1 -E '^\*\*Status:\*\*' "$f" || true)
            if [ "$line" != "**Status:** $want" ]; then
              echo "STATUS MISMATCH: $f -> '$line' (expected '**Status:** $want')"
              fail=$((fail + 1))
            else
              echo "OK: $f is $want"
            fi
          }
          for f in \
            spec/c-equiv.md \
            spec/tsc-core.md \
            spec/tsc-oper.md \
            spec/tsc-observation-dynamics.md \
            spec/tsc-conformance.md \
            spec/README.md; do
            check_status "$f" "Draft"
          done
          check_status spec/tsc-glossary.md "Informative"
          if [ $fail -gt 0 ]; then
            echo "spec-validate: $fail spec status header(s) inconsistent"
            exit 1
          fi
          echo "spec-validate: all spec status headers consistent"

      - name: Link check (spec/*.md)
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200..299,403,429
            --exclude-path "CHANGELOG.md|LICENSE"
            -- spec/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # kata-check job removed in cycle #36 — consolidated into the dedicated
  # `katas.yml` workflow which adds an OPAM + dune build cache and
  # PR-only concurrency cancellation. See `.github/workflows/katas.yml`.

  conformance-validate:
    # Failure classes guarded (schemas/README.md):
    #   - a conformance fixture that no longer satisfies
    #     schemas/conformance-fixture.cue;
    #   - registry <-> manifest drift (dangling or orphan fixtures);
    #   - a fixture referencing a requirement ID absent from
    #     spec/tsc-conformance.md, or a covered requirement missing a
    #     positive or negative case;
    #   - an evidence-rule violation (a specified fixture carrying
    #     execution evidence, or a verified fixture without replayable
    #     PASS evidence and independent PASS review).
    # Consumer: anyone reading conformance/ as the v4 proof surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.13.2

      - name: Validate v4 conformance fixtures
        run: ./scripts/ci/validate-v4-conformance.sh

  skill-validate:
    # Failure classes guarded (schemas/README.md):
    #   - skill frontmatter that no longer satisfies schemas/skill.cue;
    #   - a measurement skill declaring signals/estimates the engine or
    #     scoring instruction does not carry (declaration drift);
    #   - rendered artifacts (scripts/coh-self,
    #     .github/workflows/tsc-self-measure.yml) hand-edited or stale
    #     relative to skills/self-measure/SKILL.md (render drift).
    # Consumer: anyone reading a SKILL.md as the authority on behavior.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.13.2

      - name: Install Python deps (explicit — runner preinstall is not a contract)
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Schema self-test (positive + negative fixtures)
        run: ./scripts/ci/validate-skill-frontmatter.sh --self-test

      - name: Validate every SKILL.md frontmatter
        run: ./scripts/ci/validate-skill-frontmatter.sh

      - name: Render byte-identity (skill -> command + workflow)
        run: ./scripts/render-self-measure.sh --check

  self-measure-smoke:
    # Failure class guarded: the rendered coh-self command or the external
    # witness route (emit-prompt -> witness response -> ingest) regressing
    # silently. The tsc-self-measure llm-witness job is gated off by
    # default, so this credential-free smoke is the always-on proof of the
    # route, including its refusal path (invalid response => validation-
    # failure artifact, no report). Consumer: anyone touching
    # engine/ocaml/bin/main.ml, scripts/coh-self, or the skill.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system depexts (libcurl for ezcurl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: engine/ocaml
        run: opam install . --deps-only -y

      - name: Build engine
        working-directory: engine/ocaml
        run: opam exec -- dune build

      - name: Self-measurement smoke (mechanical + external witness route)
        run: ./scripts/ci/self-measure-smoke.sh

      - name: CM admissibility self-test (five-attacker matrix)
        # Failure class guarded: the CM selection rule crowning a
        # non-measurer. Asserts the exact matrix — engine admitted;
        # flatterer, path-gamer, boilerplate-gamer rejected;
        # basename-gamer and cherry-pick-assassin ADMITTED (the two
        # named residuals: held-out anchors and adjudication are their
        # closures). skills/cm-of-cms/SKILL.md section 6.
        run: ./scripts/cm-admissibility.sh --self-test

      - name: Held-out anchor integrity (commitments vs reveals)
        run: ./scripts/cm-heldout.sh verify

      - name: Held-out matrix (memorizers must fail the unseen anchor)
        # The second measured result, asserted permanently: on revealed
        # fail-anchor hx-02 (sealed before the challengers registered),
        # every memorization/inflation attacker misses while the engine
        # hits. Standing earned: house-authored-blind-heldout —
        # unmemorizability, not externality.
        run: ./scripts/cm-heldout.sh self-test

  forbidden-wording:
    # v0.10.0 cutover (#54 AC7): forward-only check that rejects newly-added
    # `"Operational acceptance"`, `"Operationally accepted"`,
    # `"self-coherence ACCEPT"`, `"release criteria satisfied"` outside
    # frozen-snapshot (`docs/{tier}/{bundle}/{X.Y.Z}/`) and archive
    # (`docs/archive/`) paths. Historical occurrences in excluded paths
    # do not fail the job — the check compares against the merge base /
    # main branch and only inspects newly-added lines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history so the base ref is resolvable. The script
          # defaults to `origin/main`; PR runs need its tip in the local repo.
          fetch-depth: 0

      - name: Forbidden-wording (forward-only)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            # Push runs (including `cycle/**`): compare against origin/main.
            base="origin/main"
          fi
          echo "Base ref: $base"
          bash scripts/check-forbidden-wording.sh "$base"
