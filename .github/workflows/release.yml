name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gate — tag must match VERSION
        run: |
          expected="v$(cat VERSION | tr -d '\n')"
          actual="${GITHUB_REF_NAME}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $actual does not match VERSION ($expected)"
            exit 1
          fi

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: engine/ocaml
        run: opam install . --deps-only -y

      - name: Build
        working-directory: engine/ocaml
        run: opam exec -- dune build

      - name: Prepare binary
        run: |
          cp engine/ocaml/_build/default/bin/main.exe coh-linux-x64
          chmod +x coh-linux-x64
          ./coh-linux-x64 --version

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: coh-linux-x64
          generate_release_notes: true
