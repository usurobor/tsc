# One-off maintenance: delete the stale 0.11.0 release tag (re-cut from
# main — see PR #63). Fires on pushes touching this file on the re-cut
# branch (dispatch is not available to the session credentials); refuses
# to delete a tag that does not point at the expected stale SHA. This
# file is removed from the branch after use — the deletion push then has
# no workflow to run.
name: tag-delete-once

on:
  push:
    branches:
      - claude/tsc-self-measurement-vxifjo
    paths:
      - '.github/workflows/tag-delete-once.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-22.04
    env:
      TAG: "0.11.0"
      EXPECTED_SHA: "7ffbf36ba4749071a6ed15e3eb471f4c9179821c"
    steps:
      - uses: actions/checkout@v4
      - name: Verify and delete
        run: |
          set -euo pipefail
          if ! git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            echo "tag $TAG not found on origin — nothing to delete"
            exit 0
          fi
          actual=$(git rev-parse "refs/tags/$TAG")
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::refusing: $TAG points at $actual, expected $EXPECTED_SHA"
            exit 1
          fi
          git push origin ":refs/tags/$TAG"
          echo "deleted $TAG (was $actual)"
