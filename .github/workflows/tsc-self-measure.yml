# DO NOT EDIT. Rendered by `scripts/render-self-measure.sh` from:
#   source: src/skills/self-measure/SKILL.md
# Schema:  tsc.self-measure.v1 (schemas/skill.cue #SelfMeasure)
#
# Authority split: the skill owns the measurement contract (targets,
# modes, LLM delegation + constraints); this renderer owns substrate
# encoding (triggers / permissions / action versions / secret-name
# bindings / step layout). Edit the skill, re-render, commit both.

name: tsc-self-measure

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'src/engine/ocaml/**'
      - 'targets/**'
      - 'runtime/**'
      - 'src/skills/**'
  # Measure on every branch: a measurement surface that only reads main
  # never sees the work while it can still be repaired. Firing on this
  # workflow's own file makes installation itself the first measurement
  # (same self-installation pattern as the ledger workflow).
  push:
    branches:
      - '**'
    paths:
      - 'spec/**'
      - 'src/engine/ocaml/**'
      - 'targets/**'
      - 'runtime/**'
      - 'src/skills/**'
      - '.github/workflows/tsc-self-measure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fully mechanical: deterministic structural scoring. No credentials,
  # no gate, no LLM. src/skills/self-measure/SKILL.md section 3.
  mechanical:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system depexts (libcurl for ezcurl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: src/engine/ocaml
        run: opam install . --deps-only -y

      - name: Build engine
        working-directory: src/engine/ocaml
        run: opam exec -- dune build

      - name: Self-measure (mechanical, all targets + cross-target)
        run: |
          export PATH="$PWD/src/engine/ocaml/_build/default/bin:$PATH"
          COH_BIN="$PWD/src/engine/ocaml/_build/default/bin/main.exe" \
            scripts/coh-self --mode mechanical --output .tsc/self

      - name: Summary
        if: always()
        run: |
          echo "## Self-measurement (mechanical)" >> $GITHUB_STEP_SUMMARY
          for f in .tsc/self/*.json; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python3 -m json.tool "$f" >> $GITHUB_STEP_SUMMARY 2>/dev/null || cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-self-mechanical-${{ github.sha }}
          path: .tsc/self/**
          # .tsc/self is under a dot-directory; without this the
          # default (include-hidden-files: false) uploads nothing.
          include-hidden-files: true
          retention-days: 90
          # A missing mechanical report is a failure, not an ignorable
          # condition — this job is the always-on measurement surface.
          if-no-files-found: error

  # Gate: the witness is enabled by the PRESENCE of the CLAUDE_CODE_OAUTH_TOKEN
  # secret — no separate toggle to drift out of sync with it. Secrets
  # cannot appear in job-level `if:` conditions, so a one-step job
  # projects presence into an output. Its log states the decision either
  # way (src/skills/self-measure/SKILL.md section 6).
  witness-gate:
    runs-on: ubuntu-22.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check witness credential
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "witness: CLAUDE_CODE_OAUTH_TOKEN present — llm-witness runs"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "witness: CLAUDE_CODE_OAUTH_TOKEN not configured — llm-witness unavailable (mechanical job still runs)"
          fi

  # LLM witness: the single delegated cognitive step, run per target via
  # the Claude CLI when the credential exists. The engine emits the exact
  # prompt, the model estimates deltas/components/evidence, the engine
  # validates and renders the hybrid report.
  # src/skills/self-measure/SKILL.md sections 4-5.
  llm-witness:
    needs: witness-gate
    if: ${{ needs.witness-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [spec, engine, repo]
    steps:
      - uses: actions/checkout@v4

      - name: Install system depexts (libcurl for ezcurl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: src/engine/ocaml
        run: opam install . --deps-only -y

      - name: Build engine
        working-directory: src/engine/ocaml
        run: opam exec -- dune build

      - name: Emit witness prompt (deterministic)
        run: |
          COH_BIN="$PWD/src/engine/ocaml/_build/default/bin/main.exe" \
            scripts/coh-self --emit-prompt ${{ matrix.target }} --output .tsc/self

      - name: Estimate deltas and evidence (LLM witness — Claude CLI, k=3 samples)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.199
          # The secret slot is named for the OAuth token, but route by shape:
          # an sk-ant-api key belongs in ANTHROPIC_API_KEY. Never printed.
          if [ "${CLAUDE_CODE_OAUTH_TOKEN#sk-ant-api}" != "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            export ANTHROPIC_API_KEY="$CLAUDE_CODE_OAUTH_TOKEN"
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi
          # Allow rules in both spellings (relative to cwd and filesystem-
          # absolute) — the settings file lives in RUNNER_TEMP, and rule-path
          # resolution has already denied the workspace write once. The
          # acceptEdits permission mode is the load-bearing grant: file writes
          # inside the workspace auto-accept, everything else stays denied,
          # and the engine funnel enforces content and target downstream.
          cat > "$RUNNER_TEMP/witness-settings.json" <<SETTINGS
          {
            "permissions": {
              "allow": [
                "Read(.tsc/self/prompt/**)",
                "Write(.tsc/self/response/**)",
                "Read(//${PWD#/}/.tsc/self/prompt/**)",
                "Write(//${PWD#/}/.tsc/self/response/**)"
              ]
            }
          }
          SETTINGS
          cat > "$RUNNER_TEMP/witness-prompt.md" <<'WITNESS_PROMPT'
          You are the LLM witness step of TSC self-measurement, rendered from
          src/skills/self-measure/SKILL.md. Your entire task:

          1. Read the file .tsc/self/prompt/${{ matrix.target }}.md. It contains the
             canonical scoring instruction (runtime/SELF-MEASURE.md) followed
             by the ${{ matrix.target }} target bundle. Follow that instruction exactly.
          2. Write your answer — the single JSON object the instruction
             requires, with no markdown fences and no prose around it — to
             .tsc/self/response/${{ matrix.target }}.json.

          Constraints (your tool permissions also enforce them):
          - Do not read any file other than .tsc/self/prompt/${{ matrix.target }}.md.
          - Do not write any file other than .tsc/self/response/${{ matrix.target }}.json.
          - Do not compute Coh or C_sigma values; report the delta and
            component estimates the instruction asks for. The engine applies
            the barrier transform and aggregation deterministically after
            validating your output, and rejects the response if any required
            delta field is missing or out of range.
          WITNESS_PROMPT
          # 50 turns: the repo bundle's emitted prompt runs to hundreds of
          # files, and the Read tool pages large files — 16 turns starved the
          # repo witness mid-read (run 3).
          RESP=".tsc/self/response/${{ matrix.target }}.json"; BASE="${RESP%.json}"
          T="$(basename "$RESP" .json)"
          for i in $(seq 1 3); do
            claude -p "$(cat "$RUNNER_TEMP/witness-prompt.md")" \
              --settings "$RUNNER_TEMP/witness-settings.json" \
              --permission-mode acceptEdits \
              --max-turns 50 || true
            if [ -f "$RESP" ]; then mv "$RESP" "$BASE.r$i.json"; fi
          done
          # Medoid-of-k adjudication (v3.2.3; funnel-valid election, post-loop
          # Issue 1): --target makes only samples that pass the COMPLETE
          # witness funnel electable — the same set the consistency spread is
          # computed over — so an invalid sample can never be adjudicated into
          # a guaranteed ingest failure. Zero funnel-valid samples leaves the
          # canonical response absent: the ingest step skips, and the
          # consistency step records the explicit no-valid-samples artifact
          # (expected witness invalidity is DATA, not a pipeline failure).
          if ls "$BASE".r*.json >/dev/null 2>&1; then
            if elected="$("$PWD/src/engine/ocaml/_build/default/bin/main.exe" witness-medoid --target "$T" "$BASE".r*.json)"; then
              cp "$elected" "$RESP"
            else
              echo "witness-medoid: no funnel-valid sample for $T — adjudication withheld"
            fi
          fi
          ls -l "$(dirname "$RESP")" || true

      - name: Validate and ingest witness response (deterministic)
        env:
          LLM_PROVIDER: claude-cli
          LLM_MODEL: claude-code-cli@2.1.199
        run: |
          # Absent response = zero funnel-valid samples (adjudication
          # withheld upstream). That is witness data, not a pipeline
          # failure: skip green; the consistency step records the
          # no-valid-samples artifact and failed standing.
          if [ -f ".tsc/self/response/${{ matrix.target }}.json" ]; then
            COH_BIN="$PWD/src/engine/ocaml/_build/default/bin/main.exe" \
              scripts/coh-self --ingest ${{ matrix.target }} --output .tsc/self
          else
            echo "no funnel-valid witness samples — ingest skipped"
          fi

      # Consistency protocol, LLM arm (cm-of-cms skill section 3): every
      # extra sample is validated through the same witness funnel; the
      # spread of the validated samples maps through the barrier. The
      # result is a STANDING gate, not a publishing gate — a failing
      # spread never blocks the report, it scopes its standing.
      - name: Witness consistency (k=3 spread) and standing scope
        if: always()
        run: |
          T="${{ matrix.target }}"
          BASE=".tsc/self/response/$T"
          COH="$PWD/src/engine/ocaml/_build/default/bin/main.exe"
          valid=""
          for r in "$BASE".r*.json; do
            [ -f "$r" ] || continue
            if "$COH" --mode hybrid --target "$T" \
                 --registry targets/registry.tsc --instruction runtime/SELF-MEASURE.md \
                 --root . --llm-response "$r" --output ".tsc/self/validate" >/dev/null 2>&1; then
              valid="$valid $r"
            fi
          done
          n=$(echo $valid | wc -w)
          declared=3
          refused=$((declared - n))
          # Refusal-stage counts from the validation-failure artifacts the
          # funnel wrote for the samples that did not validate.
          stage_counts=$(cat ".tsc/self"/validate/tsc-$T-*-validation-failure.json 2>/dev/null \
            | jq -cs 'map(.stage) | group_by(.) | map({(.[0]): length}) | add // {}' 2>/dev/null || echo '{}')
          # Defect-overlap observability: per validated sample, the checklist
          # counts and negative findings, one JSON line each — job logs carry
          # enough to cluster findings across samples without artifact access.
          for r in $valid; do
            jq -c '{sample: input_filename, checklist: (.axis_evidence | map_values(.checklist)), negative: (.axis_evidence | map_values(.negative))}' "$r" || true
          done
          coh_c="0"; coh_kfair="0"
          if [ "$n" -ge 2 ]; then
            COH_BIN="$COH" scripts/cm-consistency.sh llm-spread "$T" $valid || true
            coh_c=$(jq -r '.coh_consistency_max_pairwise' ".tsc/cm/consistency/$T.llm.json" 2>/dev/null || echo 0)
            coh_kfair=$(jq -r '.coh_consistency_mean_pairwise' ".tsc/cm/consistency/$T.llm.json" 2>/dev/null || echo 0)
            cp ".tsc/cm/consistency/$T.llm.json" ".tsc/self/consistency-$T.json" 2>/dev/null || true
          fi
          # Standing gate: legacy max-pairwise vs the floor (conservative,
          # unchanged). kfair_experiment_gate: the yield PRECONDITION only —
          # a short sample set fails the k-fair experiment regardless of
          # score; the numeric comparison vs baseline happens at close-out.
          gate=$(awk -v c="$coh_c" 'BEGIN { if (c >= 0.9) print "passed"; else print "failed" }')
          yield_gate=$([ "$n" -eq "$declared" ] && echo passed || echo failed)
          # Zero funnel-valid samples: explicit artifact (post-loop Issue 1).
          # No hybrid report exists, standing below records validated 0 —
          # expected witness invalidity stays green; only a pipeline failure
          # (this artifact unwritable) may redden the job.
          if [ "$n" -eq 0 ]; then
            jq -n --arg target "$T" --argjson declared "$declared" \
                  --argjson refused "$refused" --argjson stages "$stage_counts" \
                  '{target: $target, status: "no_valid_witness_samples",
                    declared_samples: $declared, validated_samples: 0,
                    refused_samples: $refused, refusal_stage_counts: $stages}' \
                  > ".tsc/self/no-valid-witness-samples-$T.json"
          fi
          jq -n --arg target "$T" --argjson declared "$declared" --argjson n "$n" \
                --argjson refused "$refused" --argjson stages "$stage_counts" \
                --argjson coh "$coh_c" --argjson kfair "$coh_kfair" \
                --arg gate "$gate" --arg ygate "$yield_gate" \
                '{standing_scope: "house-authored-public-commons", admissibility: "public-only",
                  heldout_status: "none", external_anchor_count: 0,
                  llm_consistency_gate: $gate, llm_consistency_floor: 0.9,
                  coh_consistency: $coh,
                  coh_consistency_max_pairwise: $coh, coh_consistency_mean_pairwise: $kfair,
                  declared_samples: $declared, validated_samples: $n,
                  refused_samples: $refused, refusal_stage_counts: $stages,
                  kfair_experiment_gate: $ygate, target: $target}' \
                > ".tsc/self/standing-$T.json"
          echo "consistency: $T k=$n/$declared Coh_max=$coh_c Coh_kfair=$coh_kfair gate=$gate yield=$yield_gate (standing gate, never a publishing gate)"
      - name: Summary
        if: always()
        run: |
          echo "## Self-measurement (hybrid, ${{ matrix.target }})" >> $GITHUB_STEP_SUMMARY
          for f in .tsc/self/*.json; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python3 -m json.tool "$f" >> $GITHUB_STEP_SUMMARY 2>/dev/null || cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-self-llm-${{ matrix.target }}-${{ github.sha }}
          # Reports, witness responses, and validation-failure artifacts —
          # but never the emitted prompts (full bundle text).
          path: |
            .tsc/self/**
            !.tsc/self/prompt/**
          # .tsc/self is under a dot-directory; without this the
          # default (include-hidden-files: false) uploads nothing.
          include-hidden-files: true
          retention-days: 90
          # If the witness ran, something durable must exist (report or
          # validation-failure artifact + raw response).
          if-no-files-found: error
