name: TSC Measurement

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'engine/ocaml/**'
      - 'targets/**'
      - 'runtime/**'
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'engine/ocaml/**'
      - 'targets/**'
      - 'runtime/**'

jobs:
  self-measure:
    runs-on: ubuntu-latest
    # Only run if the LLM API key is available
    if: ${{ vars.TSC_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        working-directory: engine/ocaml
        run: opam install . --deps-only -y

      - name: Build engine
        working-directory: engine/ocaml
        run: opam exec -- dune build

      - name: Run self-measurement (spec target)
        id: measure-spec
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

        run: |
          mkdir -p .tsc
          opam exec -- dune exec --root engine/ocaml -- tsc-engine \
            --target spec \
            --registry targets/registry.tsc \
            --instruction runtime/SELF-MEASURE.md \
            --output .tsc/spec-report.json

      - name: Run self-measurement (engine target)
        id: measure-engine
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

        run: |
          opam exec -- dune exec --root engine/ocaml -- tsc-engine \
            --target engine \
            --registry targets/registry.tsc \
            --instruction runtime/SELF-MEASURE.md \
            --output .tsc/engine-report.json

      - name: Run self-measurement (repo target)
        id: measure-repo
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

        run: |
          opam exec -- dune exec --root engine/ocaml -- tsc-engine \
            --target repo \
            --registry targets/registry.tsc \
            --instruction runtime/SELF-MEASURE.md \
            --output .tsc/repo-report.json

      - name: Display results
        if: always()
        run: |
          echo "## TSC Self-Measurement Report" >> $GITHUB_STEP_SUMMARY
          for target in spec engine repo; do
            report=".tsc/${target}-report.json"
            if [ -f "$report" ]; then
              echo "### Target: $target" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$report" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY 2>/dev/null || cat "$report" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### Target: $target" >> $GITHUB_STEP_SUMMARY
              echo "*No report generated.*" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-reports-${{ github.sha }}
          path: .tsc/*-report.json
          retention-days: 90
          if-no-files-found: ignore
