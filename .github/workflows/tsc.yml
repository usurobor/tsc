name: TSC Measurement

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'reference/python/tsc_measure.py'  # Changed from self_measure.py
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'reference/python/tsc_measure.py'  # Changed from self_measure.py

jobs:
  self-measure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full git history for γ_c
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run self-measurement
        id: measure
        run: |
          tsc self || echo "verdict=FAIL" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Get version and find report
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print('v' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "report_file=.tsc/tsc-$VERSION.json" >> $GITHUB_OUTPUT
      
      - name: Display results
        run: |
          REPORT_FILE="${{ steps.version.outputs.report_file }}"
          
          echo "## TSC Report" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat "$REPORT_FILE" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract key metrics (updated paths)
          C_SIGMA=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['current']['scores']['C_sigma'])")
          VERDICT=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['verdict'])")
          ALPHA=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['current']['scores']['alpha_c'])")
          BETA=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['current']['scores']['beta_c'])")
          GAMMA=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['current']['scores']['gamma_c'])")
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**α (alpha):** $ALPHA" >> $GITHUB_STEP_SUMMARY
          echo "**β (beta):** $BETA" >> $GITHUB_STEP_SUMMARY
          echo "**γ (gamma):** $GAMMA" >> $GITHUB_STEP_SUMMARY
          echo "**C_Σ:** $C_SIGMA" >> $GITHUB_STEP_SUMMARY
          echo "**Verdict:** $VERDICT" >> $GITHUB_STEP_SUMMARY
          
          if [ "$VERDICT" = "FAIL" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Note:** FAIL verdict indicates the repository needs improvement." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coherence-report-${{ github.sha }}
          path: ${{ steps.version.outputs.report_file }}
          retention-days: 90
      
      - name: Upload README
        uses: actions/upload-artifact@v4
        with:
          name: coherence-readme-${{ github.sha }}
          path: .tsc/README.md
          retention-days: 90
      
      - name: Check verdict (informational)
        run: |
          REPORT_FILE="${{ steps.version.outputs.report_file }}"
          VERDICT=$(cat "$REPORT_FILE" | python -c "import sys, json; print(json.load(sys.stdin)['verdict'])")
          if [ "$VERDICT" = "FAIL" ]; then
            echo "::warning::TSC check failed. See .tsc/ for details."
          else
            echo "::notice::TSC check passed!"
          fi